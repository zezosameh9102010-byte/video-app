<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video App</title>
<style>
*{box-sizing:border-box}body{margin:auto;font-family:sans-serif;background:#111;color:#fff;padding:12px;max-width:600px}
input,select,textarea,button{font:inherit;width:100%;padding:12px;margin:4px 0;border-radius:10px;border:1px solid #444;background:#222;color:#fff}
button{background:#7c3aed;border:0}button.s{background:#333;width:auto;padding:8px 14px}
.c{background:#1b1b1b;border-radius:12px;padding:10px;margin:10px 0}.r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
img.t{width:60px;height:100px;object-fit:cover;border-radius:6px}small{color:#aaa}
</style></head><body>
<div class="r"><h2 id="ttl" style="flex:1"></h2><button class="s" id="lg" onclick="tog()">EN / ع</button></div>
<div id="hm"><div class="c"><input id="tp"><select id="du"><option>15</option><option selected>30</option><option>45</option><option>60</option></select><button id="mk" onclick="mkP()"></button></div><div id="pl"></div></div>
<div id="ed" hidden><button class="s" id="bk" onclick="home()"></button> <small id="sv"></small>
<small id="nt" style="display:block"></small><div id="sc"></div><button class="s" id="ad" onclick="addS()"></button>
<div class="c"><small id="al"></small><input type="file" accept="audio/*" onchange="aF=this.files[0]">
<button id="ex" onclick="render()"></button><button id="sr" onclick="srt()"></button><div id="pg"></div><div id="out"></div></div></div>
<script>
const T={en:{title:'Video App',topic:'Video topic',mk:'Create project (template script)',bk:'← Back',ad:'+ Scene',ex:'Export video',sr:'Download SRT',al:'Background audio (optional, not saved)',del:'Delete',open:'Open',saved:'Saved ✓',nt:'The script is a template for now. Edit the text. AI comes next.',total:'Total seconds: ',hook:'Hook: a surprising fact about ',pt:'Point about ',end:'Follow for more!',sec:'Seconds'},
ar:{title:'تطبيق الفيديو',topic:'موضوع الفيديو',mk:'إنشاء مشروع (نص قالب)',bk:'→ رجوع',ad:'+ مشهد',ex:'تصدير الفيديو',sr:'تحميل SRT',al:'صوت خلفية (اختياري، لا يُحفظ)',del:'حذف',open:'فتح',saved:'تم الحفظ ✓',nt:'النص قالب حالياً. عدّله. الذكاء الاصطناعي لاحقاً.',total:'مجموع الثواني: ',hook:'البداية: معلومة مفاجئة عن ',pt:'نقطة عن ',end:'تابعنا للمزيد!',sec:'ثواني'}};
let L='en';try{L=localStorage.lang||'en'}catch(e){}
const t=k=>T[L][k],$=i=>document.getElementById(i),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null,aF=null,tm;
function ui(){document.documentElement.dir=L=='ar'?'rtl':'ltr';$('ttl').textContent=t('title');$('tp').placeholder=t('topic');['mk','bk','ad','ex','sr','nt','al'].forEach(k=>$(k).textContent=t(k));if(cur)scn()}
function tog(){L=L=='en'?'ar':'en';try{localStorage.lang=L}catch(e){}ui();if(!cur)home()}
const db=new Promise((ok,no)=>{const r=indexedDB.open('vapp',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const q=f(d.transaction('p',m).objectStore('p'));q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const put=p=>tx('readwrite',s=>s.put(p)),all=()=>tx('readonly',s=>s.getAll()),rm=id=>tx('readwrite',s=>s.delete(id));
function save(){clearTimeout(tm);tm=setTimeout(()=>put(cur).then(()=>$('sv').textContent=t('saved')).catch(e=>$('sv').textContent='Save error: '+e),400)}
async function home(){cur=null;$('ed').hidden=true;$('hm').hidden=false;const ps=await all();$('pl').innerHTML=ps.map(p=>`<div class="c"><b>${esc(p.name)}</b><div class="r"><button class="s" onclick="openP('${p.id}')">${t('open')}</button><button class="s" onclick="delP('${p.id}')">${t('del')}</button></div></div>`).join('')}
async function openP(id){cur=(await all()).find(p=>p.id==id);$('hm').hidden=true;$('ed').hidden=false;$('out').innerHTML='';$('pg').textContent='';ui()}
async function delP(id){if(confirm('?')){await rm(id);home()}}
function mkP(){const tp=$('tp').value.trim()||'...',d=+$('du').value,n=Math.max(3,Math.round(d/6)),sec=Math.round(d/n);const sc=[];
for(let i=0;i<n;i++)sc.push({text:i==0?t('hook')+tp:i==n-1?t('end'):t('pt')+tp+' '+i,sec,img:''});
cur={id:'p'+Date.now(),name:tp,lang:L,scenes:sc};put(cur).then(()=>openP(cur.id))}
function scn(){$('sc').innerHTML=cur.scenes.map((s,i)=>`<div class="c"><div class="r">${s.img?`<img class="t" src="${s.img}">`:''}<div style="flex:1"><textarea rows="3" oninput="u(${i},'text',this.value)">${esc(s.text)}</textarea><small>${t('sec')}</small><input type="number" min="1" max="60" value="${s.sec}" oninput="u(${i},'sec',+this.value||1)"></div></div>
<input type="file" accept="image/*" onchange="pick(${i},this)"><div class="r"><button class="s" onclick="mv(${i},-1)">▲</button><button class="s" onclick="mv(${i},1)">▼</button><button class="s" onclick="say(${i})">🔊</button><button class="s" onclick="dl(${i})">✕</button></div></div>`).join('')+`<small>${t('total')}${cur.scenes.reduce((a,s)=>a+s.sec,0)}</small>`}
function u(i,k,v){cur.scenes[i][k]=v;save()}
function addS(){cur.scenes.push({text:'',sec:5,img:''});save();scn()}
function dl(i){cur.scenes.splice(i,1);save();scn()}
function mv(i,d){const j=i+d;if(j<0||j>=cur.scenes.length)return;[cur.scenes[i],cur.scenes[j]]=[cur.scenes[j],cur.scenes[i]];save();scn()}
function say(i){speechSynthesis.cancel();const x=new SpeechSynthesisUtterance(cur.scenes[i].text);x.lang=cur.lang=='ar'?'ar-SA':'en-US';speechSynthesis.speak(x)}
function pick(i,el){const f=el.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1280/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cur.scenes[i].img=c.toDataURL('image/jpeg',.8);save();scn()};im.src=URL.createObjectURL(f)}
const ts=s=>{const p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(Math.floor(s%60))+',000'};
function get(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function srt(){let a=0,o='';cur.scenes.forEach((s,i)=>{o+=(i+1)+'\n'+ts(a)+' --> '+ts(a+s.sec)+'\n'+s.text+'\n\n';a+=s.sec});get(new Blob([o],{type:'text/plain'}),'captions.srt')}
function wrap(g,x,mw){const ls=[];let l='';for(const w of x.split(/\s+/)){const n=l?l+' '+w:w;if(g.measureText(n).width>mw&&l){ls.push(l);l=w}else l=n}if(l)ls.push(l);return ls}
function draw(g,s,im,a,W,H){g.globalAlpha=1;g.fillStyle='#000';g.fillRect(0,0,W,H);g.globalAlpha=a;
if(im){const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;g.drawImage(im,(W-w)/2,(H-h)/2,w,h)}else{const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#4c1d95');gr.addColorStop(1,'#111');g.fillStyle=gr;g.fillRect(0,0,W,H)}
g.globalAlpha=1;g.font='bold 48px sans-serif';g.textAlign='center';g.direction=/[\u0600-\u06FF]/.test(s.text)?'rtl':'ltr';
const ls=wrap(g,s.text,W-100),bh=ls.length*64+40,y=H*0.7;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(30,y-50,W-60,bh);g.fillStyle='#fff';ls.forEach((l,i)=>g.fillText(l,W/2,y+i*64))}
async function render(){const p=cur,W=720,H=1280;if(!window.MediaRecorder){alert('MediaRecorder not supported');return}
const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
const imgs=await Promise.all(p.scenes.map(s=>new Promise(r=>{if(!s.img)return r(null);const i=new Image();i.onload=()=>r(i);i.src=s.img})));
const st=cv.captureStream(30);let au=null;
if(aF){au=new Audio(URL.createObjectURL(aF));const ac=new AudioContext(),d=ac.createMediaStreamDestination();ac.createMediaElementSource(au).connect(d);st.addTrack(d.stream.getAudioTracks()[0])}
const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
const rec=new MediaRecorder(st,mt?{mimeType:mt,videoBitsPerSecond:4000000}:{}),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
const done=new Promise(r=>rec.onstop=r),total=p.scenes.reduce((a,s)=>a+s.sec,0)*1000;
$('ex').disabled=true;$('out').innerHTML='';const t0=performance.now();rec.start();if(au)au.play();
const fr=()=>{const el=performance.now()-t0;if(el>=total){rec.stop();if(au)au.pause();return}
let acc=0,k=0;for(;k<p.scenes.length-1;k++){if(el<acc+p.scenes[k].sec*1000)break;acc+=p.scenes[k].sec*1000}
draw(g,p.scenes[k],imgs[k],Math.min(1,(el-acc)/400),W,H);$('pg').textContent=Math.round(el/total*100)+'% (keep this screen open)';requestAnimationFrame(fr)};
fr();await done;$('ex').disabled=false;$('pg').textContent='';
const type=rec.mimeType||'video/webm',ext=type.includes('mp4')?'mp4':'webm',b=new Blob(ch,{type}),url=URL.createObjectURL(b);
$('out').innerHTML=`<p>Format: ${ext.toUpperCase()}</p><video src="${url}" controls style="width:60%"></video>`;
const bt=document.createElement('button');bt.textContent='Download .'+ext;bt.onclick=()=>get(b,'video.'+ext);$('out').appendChild(bt)}
ui();home();
</script></body></html>
